<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="../imgs/LogoPetMatch.svg" type="image/x-icon">
</head>

<body>
    <header class="cabecalho">
        <a href="#">
            <img src="../imgs/LogoCabecalho.svg" alt="Logo do sistema Bibliotec.">
        </a>
    </header>

    <main class="fundo">
        <section class="login">
            <div class="login-cabecalho">
                <img src="../imgs/LogoEscrita.svg" alt="Logo BiblioTec">

                <h1>Faça o login para continuar</h1>
            </div>


            <form>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="meuemail@gmail.com">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="insira sua senha...">
                </div>

                <button type="submit" class="botao-entrar">Entrar</button>

                <button class="botao-google">
                    <img src="../imgs/icone-google.svg" alt="Logo Google">
                    <span>continuar com Google</span>
                </button>
            </form>
        </section>
    </main>

</body>


</html>
