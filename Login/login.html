<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetMatch - Login</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <header class="cabecalho">
    <a href="#">
      <img src="../img/LogoCabecalho.svg" alt="PetMatch">
    </a>
    <input class="busca" type="search" placeholder="Buscar..." aria-label="Buscar">
  </header>

  <main class="principal">

    <section class="lado-esquerdo">
      <img class="logo-escrita" src="../img/LogoEscrita.svg" alt="PetMatch">
      <img class="logo-mascote" src="../img/LogoPetMatch.svg" alt="Cachorro e gato abraçados">
    </section>

    <section class="card">
      <h1>Faça login para continuar</h1>

      <form class="formulario" action="#" method="post">

        <div class="linha">
          <img src="../img/icone-email.svg" alt="">
          <input type="text" name="login" placeholder="Digite seu Login" aria-label="Login">
        </div>

        <div class="linha linha-senha">
          <img src="../img/icone-cadeado.svg" alt="">
          <input type="password" name="senha" placeholder="Digite sua senha" aria-label="Senha">
        </div>

        <div class="opcoes">
          <label class="lembrar">
            <input type="checkbox" name="lembrar">
            Lembrar de Mim
          </label>
          <a href="#">esqueceu sua senha ?</a>
        </div>

        <button type="submit">CONTINUAR</button>
      </form>
    </section>

  </main>

</body>
</html>
